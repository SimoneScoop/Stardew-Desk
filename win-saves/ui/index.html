<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self';"><title>Stardew Desk 存档版</title><link rel="stylesheet" href="styles.css"></head><body>
<canvas id="farm" aria-label="你的农场预览"></canvas>
<aside id="sidebar">
 <div class="brand"><span class="leaf">🌱</span><div><h1>我的星露谷</h1><p>把自己的农场，放回桌面。</p></div><span class="version">0.5.1</span></div>
 <div class="section"><label>场景模式</label><div class="actions"><button id="standalone-open" class="primary">独立自定义农场</button></div><div class="small">独立素材包 · 自由布置 · 无需游戏本体</div></div>
 <div class="section"><label for="saves">选择存档</label><div class="select-row"><select id="saves" aria-label="选择存档"></select><button id="rescan" title="重新扫描存档">↻</button></div><div class="actions"><button id="load">载入农场</button><button id="apply" class="primary">设为桌面</button></div><button id="content" class="link">选择游戏素材位置</button></div>
 <div class="farm-card"><span id="map-type" class="eyebrow">等待载入</span><h2 id="farm-name">你的农场</h2><div id="date" class="date"></div><div id="stats" class="stats"></div><div id="saved-time" class="small"></div></div>
 <div class="section"><label>快捷方式箱子</label><div class="select-row"><select id="chests" aria-label="选择快捷箱"></select><button id="open-chest">打开</button></div><div class="small">也可以直接点击农场里的箱子。<br>每格对应一个桌面快捷方式。</div></div>
 <div class="section"><label>村民互动</label><div class="select-row"><select id="npc-choice" aria-label="邀请村民"></select><button id="npc-invite">邀请</button></div><div class="actions"><button id="npc-find">找到访客</button><button id="npc-talk">聊一聊</button></div><div id="npc-info" class="small">点击村民可问好、聊天、跟随鼠标、自由走动或告别。最多 3 位访客。</div><div class="small">好感按农场保存：每天问好、聊天、送礼可提升。<br>这是桌面好感，不修改游戏存档。</div></div>
 <div class="section"><label>原版功能</label><div class="setting"><span>配乐</span><select id="music"><option value="off">关闭</option><option value="always">一直播放</option><option value="saver">屏保时播放</option></select></div><div class="setting"><span>音量</span><select id="music-volume"><option value="low">小</option><option value="mid">中</option><option value="high">大</option></select></div><div id="music-info" class="small"></div><div class="setting"><span>屏保</span><select id="saver-minutes"><option value="0">关闭</option><option value="3">闲置 3 分钟</option><option value="5">闲置 5 分钟</option><option value="10">闲置 10 分钟</option><option value="15">闲置 15 分钟</option></select></div><div class="setting"><span>宠物</span><select id="pet-choice"><option value="cat0">橘猫</option><option value="cat1">灰猫</option><option value="cat2">黄猫</option><option value="cat3">白猫</option><option value="cat4">黑猫</option><option value="cat5">紫猫</option><option value="dog0">黄狗</option><option value="dog1">牧羊犬</option><option value="dog2">金毛</option><option value="dog3">黑白花狗</option><option value="dog4">棕狗</option><option value="dog5">紫狗</option><option value="none">不养宠物</option></select></div><div class="actions"><button id="original-open">自定义农场 / 自由布置</button></div></div>
 <div class="section"><label>专注种田</label><div class="actions"><button id="focus-25">25 分钟</button><button id="focus-50">50 分钟</button><button id="focus-cancel">取消</button></div><div id="focus-info" class="small"></div></div>
 <div class="section"><label>公告板</label><div class="select-row"><input id="todo-quick" placeholder="添加今日待办" maxlength="80" aria-label="今日待办"><button id="todo-quick-add">添加</button></div><div id="quick-todos"></div><div class="actions"><button id="board-settings">上下班 / 日薪 / 公告板设置</button></div></div>
 <div class="section"><label>画面</label><div class="setting"><span>光照</span><select id="daylight"><option value="real">跟随现实时间</option><option value="day">始终白天</option><option value="night">始终夜晚</option></select></div><div class="setting"><span>天气</span><select id="weather"><option value="save">跟随存档</option><option value="live">实时天气</option><option value="sunny">晴天</option><option value="cloudy">阴天</option><option value="rain">下雨</option><option value="storm">雷雨</option><option value="fog">雾</option><option value="windy">大风</option><option value="snow">下雪</option></select></div><div class="setting" id="city-row"><input id="city" aria-label="天气城市" placeholder="输入城市"><button id="city-save">更换城市</button></div><div class="setting"><span>帧率</span><select id="quality"><option value="10">省电 · 10 fps</option><option value="15">平衡 · 15 fps</option><option value="30">流畅 · 30 fps</option></select></div><label class="check"><input id="animate" type="checkbox" checked>动物自由活动</label></div>
 <div class="section"><label>视角</label><div class="actions"><button id="fill">铺满屏幕</button><button id="full">全图预览</button><button id="home">农舍附近</button></div><div class="actions"><button id="remember">保存桌面视角</button></div><div class="small">桌面始终铺满，边缘按屏幕比例裁切。<br>拖动平移 · 滚轮缩放 · H 隐藏面板</div></div>
 <div id="warnings" class="warnings"></div><div class="footer">显示最后保存的布局与作物状态。<br>动物活动为桌面模拟；游戏保存后自动刷新。</div>
</aside>
<div id="status" role="status">正在读取本机存档…</div><div id="tooltip"></div><div id="badge"></div><div id="loading" hidden><div class="loading-card"><div class="sprout">🌱</div><strong id="loading-text">正在还原农场…</strong><span>从本机游戏读取素材</span></div></div>
<script src="game-font.js"></script><script src="sky.js"></script><script src="board.js"></script><script src="focus.js"></script><script src="critters.js"></script><script src="npc-roster.js"></script><script src="npc-personality.js"></script><script src="npc-navigation.js"></script><script src="sprite-frames.js"></script><script src="npc-visitors.js"></script><script src="weather.js"></script><script src="motion-camera.js"></script><script src="sprite-layout.js"></script><script src="grass-motion.js"></script><script src="building-layout.js"></script><script src="original-features.js"></script><script src="renderer.js"></script></body></html>
